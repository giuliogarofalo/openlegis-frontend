<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fallback title. Everything that varies per page — title, description,
         canonical, robots, Open Graph, Twitter, JSON-LD — is owned solely by
         react-helmet-async (src/seo.jsx) and baked into the prerendered HTML.
         Keeping those tags here too would duplicate them. -->
    <title>Open·Parlamento — interroga la legge</title>
    <meta name="theme-color" content="#0b0d11" />
    <meta name="author" content="Giulio Garofalo" />

    <!-- Google Analytics (GA4). Caricato solo sull'host di produzione: così il
         prerender (localhost) e il dev non inviano hit. I page_view per le rotte
         SPA sono emessi da src/usePageviews.js (send_page_view: false qui).
         (Umami è pronto ma IN STANDBY: vedi src/analytics.js, inattivo senza VITE_UMAMI_WEBSITE_ID.) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      if (location.hostname === 'openlegis.it' || location.hostname === 'www.openlegis.it') {
        var _ga = document.createElement('script');
        _ga.async = true;
        _ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-18LNSCHMYE';
        document.head.appendChild(_ga);
        gtag('js', new Date());
        gtag('config', 'G-18LNSCHMYE', { send_page_view: false });
      }
    </script>

    <!-- Icons / PWA -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font stylesheet non render-blocking: caricato come media="print" e promosso a
         "all" all'onload → niente blocco di FCP/LCP. display=swap mostra subito il
         fallback. <noscript> garantisce il caricamento anche senza JS (crawler). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
