# Open Parlamento — serve la SPA statica e fa da reverse-proxy interno verso
# LightRAG (/lr) e il gateway freemium (/api). L'agente NON è più esposto
# pubblicamente: ci arriva solo il gateway. Usa il DNS interno di Docker via
# variabili, così nginx NON crasha all'avvio se un upstream non è in esecuzione.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirect relativi: evita che nginx (dietro Caddy, in http) emetta Location http://…
    # così lo schema https del browser viene preservato.
    absolute_redirect off;

    resolver 127.0.0.11 valid=30s ipv6=off;   # DNS interno di Docker

    # Rotte client-only (NON prerenderate): /app + auth/account. Servono sempre la shell
    # SPA (index.html, 200). Devono precedere `location /` per non finire nel 404 sotto.
    location ~ ^/(en/)?(app|login|registrati|password-dimenticata|reset-password|piani|impostazioni|admin)(/|$) {
        # Servi il prerender PROPRIO della rotta se esiste (es. /app/index.html porta
        # il suo <meta robots=noindex>); solo in sua assenza cadi sulla shell home.
        # Prima si serviva sempre /index.html → /app ereditava robots=index + canonical
        # alla home ⇒ "Pagina con reindirizzamento"/duplicato in GSC.
        try_files $uri/index.html /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Pagine-norma con trailing slash → 301 alla versione canonica (senza slash),
    # coerente con <link canonical> e sitemap. Non tocca /norme né /norme/ (indice).
    location ~ ^/(norme/.+)/$ {
        return 301 /$1;
    }

    # Rotte di contenuto prerenderate: servo l'URL SENZA slash direttamente con il suo index.html
    # (200, niente 301 trailing-slash) → canonical/sitemap (senza slash) coincidono con l'URL servito.
    # Niente file e non è una rotta client → 404 VERO (prima cadeva su /index.html = soft-404,
    # 200 ovunque). try_files cade su =404 → error_page sotto serve /404.html con status 404.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Corpo del 404 (noindex, prerenderato in dist/404.html): servito con status HTTP 404 reale.
    error_page 404 /404.html;

    # Asset hashati da Vite → cache eterna (immutable). ^~ vince sui match regex.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media statici in root (favicon, icone, og-cover) → cache moderata.
    location ~* \.(?:png|jpe?g|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Ricerca semantica LightRAG: unico POST consentito (sola lettura, nessun side-effect).
    location = /lr/query {
        set $up_lrq http://lightrag-v2:9621;
        rewrite ^/lr/(.*)$ /$1 break;
        proxy_pass $up_lrq;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        limit_except GET HEAD POST { deny all; }
    }

    # API LightRAG v2 (grafo per-articolo) — SOLO LETTURA dal pubblico.
    # limit_except GET HEAD → blocca POST/PUT/PATCH/DELETE (upload/cancellazione documenti):
    # senza questo, in prod chiunque potrebbe corrompere il grafo. La webapp usa solo GET.
    location /lr/ {
        set $up_lr http://lightrag-v2:9621;
        rewrite ^/lr/(.*)$ /$1 break;
        proxy_pass $up_lr;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        limit_except GET HEAD { deny all; }
    }

    # (opzionale) grafo whole-file v3 — risolto a runtime, 502 se v3 non c'è (niente crash). Sola lettura.
    location /lr3/ {
        set $up_lr3 http://lightrag-v3:9621;
        rewrite ^/lr3/(.*)$ /$1 break;
        proxy_pass $up_lr3;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        limit_except GET HEAD { deny all; }
    }

    # API pubblica read-only (grafo/norme/relazioni + OpenAPI/Swagger). Solo GET/HEAD.
    # Più specifica di /api/ → vince. Il servizio serve già i suoi path sotto /api/public/.
    location /api/public/ {
        set $up_pub http://public-api:8090;
        proxy_pass $up_pub;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # Endpoint macchina (OpenAPI/Swagger/JSON): mai indicizzare come pagina.
        add_header X-Robots-Tag "noindex" always;
        limit_except GET HEAD { deny all; }
    }

    # Umami (analytics privacy-friendly, self-hosted). Servito sotto /umami (BASE_PATH=/umami):
    # tracker /umami/script.js, ingest /umami/api/send, dashboard /umami. Cambia la password admin!
    location /umami/ {
        set $up_umami http://umami:3000;
        proxy_pass $up_umami;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Streaming SSE (/api/ask/stream): buffering DISATTIVATO, altrimenti nginx accumula la
    # risposta e il client vede ERR_CONNECTION_CLOSED. Location più specifica → vince su /api/.
    location /api/ask/stream {
        set $up_gws http://gateway:8000;
        proxy_pass $up_gws;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;                # niente buffering → eventi inviati subito
        proxy_cache off;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;    # disabilita anche eventuali buffer a valle
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    # Gateway freemium: auth/account/tier + chat proxy gated (/api/ask) + webhook billing.
    # NB: nessun rewrite — il gateway serve i suoi router già sotto /api/*.
    location /api/ {
        set $up_gw http://gateway:8000;
        proxy_pass $up_gw;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # serve al rate-limit anonimo
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;                                       # /ask: Gemini + connettori = lento
        client_max_body_size 1m;
    }

    # Bridge MCP per ShopBrain (piano migrazione, Fase 1): POST /tools/{nome}/execute,
    # autenticato lato agente con X-Internal-API-Key (non è un'eccezione al "agente mai
    # pubblico" di riga 2-3: qui esponiamo solo questo path, protetto da chiave condivisa).
    location /mcp-tools/ {
        set $up_mcp http://agent:8077;
        rewrite ^/mcp-tools/(.*)$ /$1 break;
        proxy_pass $up_mcp;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex" always;
        limit_except POST { deny all; }
    }

    # Webhook billing registrato come /webhooks/billing (senza /api): lo inoltro al gateway
    # che lo serve sotto /api/webhooks/billing. Rewrite + variabile (come /api/, niente crash all'avvio).
    location /webhooks/ {
        set $up_gwh http://gateway:8000;
        rewrite ^/webhooks/(.*)$ /api/webhooks/$1 break;
        proxy_pass $up_gwh;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }
}
